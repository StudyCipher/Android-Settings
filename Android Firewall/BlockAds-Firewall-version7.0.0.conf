# Configuration Profile for BlockAds version 7.0.0

# Lines starting with ";" or "#" or "//" are comments.

# SETTINGS VALUES:
# The asterisk (*) means not rule set up. Also can means that applies to all rules, depends on rules.


# All posible rules for Domains are: host, host-suffix & host-keyword

# Host rules are for exact match. Example: host, time.aws.com, reject / host, app.tuta.com, direct
# Host-suffix rules are for matching exact and subdomain reading. Example: host-suffix, ntp.time.nl, direct / host-suffix, mozilla.cloudflare-dns.com, reject
# Host-keyword rules are for matches any host that have a main word (Do not recommend for beginners). Example: host-keyword, analytics, reject / host-keyword, ntp, direct

# All posible rules for IP addresses are: ip-cidr, ip-cidr6, geoip

# IP-cidr are IPv4 rules. Example: ip-cidr, 1.1.1.3, reject / ip-cidr, 9.9.9.9, direct
# IP-cidr6 are IPv6 rules. Example: ip-cidr6, 2001:4860:4860::8888, reject  / ip-cidr6, 2606:4700:4700::1003, direct
# Geoip are rules for countries (Do not recommend for beginners). Example: geoip, CA, reject / geoip, US, direct

# All posible rules for "Others" are: user-agent, final

# User-agent matches header from HTTP request & apps (Advanced). Example: user-agent, *Spotify*, reject / user-agent, *Outlook*, direct
# Final is as fallback rule, I think this is like IPtables or Windows firewall default value (Do not recommend for beginners). Example: final, direct / final, reject


# All posible rules for Policy are: reject, direct & proxy

# Reject rules are for deny, drop, block domains, IP, etc. Example: ip-cidr, 8.8.8.8, reject / host-suffix, pool.ntp.org, reject
# Direct rules are for accept, allow, green-light domains, IP, etc. Example: ip-cidr6, 2606:4700:4700::1111, direct / host, www.google.com, direct
# Proxy rules are for foward matched traffic through a proxy (Do not recommend for beginners). Example: host-suffix, overseas-service.com, proxy


# All possible filtrers are the one you would like to use. Examples are at the bottom of the file (Long parameters to write on here).

[general]
# Current exclusion for DNS provider
# Still investigating how to set up without GUI
dns_exclusion_list = *.local, localhost, *.lan

[dns]
# Current DNS provider (DNS over Quic)
# Still investigating how to set up without GUI
server = family.freedns.controld.com
[policy]
static = DIRECT, direct
static = REJECT, reject

[filter_local]
